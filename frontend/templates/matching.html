<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching - MentorLink</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        .matching-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .matching-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .matching-header h2 {
            font-size: 2rem;
            color: #1a1a2e;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .matching-header .subtitle {
            color: #666;
            font-size: 1rem;
        }

        /* Filtres */
        .filters-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.2s;
            outline: none;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #0d6efd;
        }

        .search-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            height: fit-content;
        }

        .search-btn:hover {
            background: #0b5ed7;
        }

        /* Résultats */
        .results-info {
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 20px;
            padding-left: 4px;
        }

        .results-info strong {
            color: #0d6efd;
        }

        .mentor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .mentor-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .mentor-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #00c6ff);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .card-info h4 {
            margin: 0 0 4px;
            font-size: 1.05rem;
            color: #1a1a2e;
        }

        .card-info .meta {
            font-size: 0.82rem;
            color: #888;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .badge-filiere {
            background: #e7f0ff;
            color: #0d6efd;
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 0.72rem;
            font-weight: bold;
        }

        .role-badge {
            font-size: 0.78rem;
            font-weight: 600;
            margin-top: 4px;
            display: inline-block;
        }

        .role-badge.mentor {
            color: #0d6efd;
        }

        .role-badge.mentore {
            color: #28a745;
        }

        /* Score bar */
        .score-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .score-label {
            font-size: 0.82rem;
            color: #555;
            white-space: nowrap;
        }

        .score-bar {
            flex: 1;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #0d6efd, #00c6ff);
            transition: width 0.6s ease;
        }

        .score-pct {
            font-weight: bold;
            color: #0d6efd;
            font-size: 0.95rem;
            min-width: 40px;
            text-align: right;
        }

        /* Compétences */
        .competences {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag-small {
            background: #e7f0ff;
            color: #0d6efd;
            border-radius: 12px;
            padding: 4px 10px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .dispo-line {
            font-size: 0.82rem;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dispo-line span {
            font-weight: 600;
            color: #0d6efd;
        }

        .contact-btn {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            width: 100%;
            margin-top: auto;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .contact-btn:hover {
            background: #0b5ed7;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
            grid-column: 1 / -1;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0d6efd;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }
            .mentor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<nav>
    <h1 class="logo">MentorLink🎓</h1>
    <div style="margin-top:15px">
        <a class="btn" href="/profile">Mon Profil</a>
        <a class="btn" href="/offers">Offres</a>
        <a class="btn" href="/chat">Messages</a>
    </div>
</nav>

<div class="matching-container">
    <div class="matching-header">
        <h2>🔗 Matching Mentor / Mentoré</h2>
        <p class="subtitle">Trouvez les correspondances les plus compatibles avec votre profil</p>
    </div>

    <!-- Filtres -->
    <div class="filters-card">
        <div class="filters-grid">
            <div class="filter-group">
                <label>Matière / Compétence</label>
                <input type="text" id="filtreMatiere" placeholder="Ex: Python, SQL...">
            </div>
            <div class="filter-group">
                <label>Filière</label>
                <select id="filtreFiliere">
                    <option value="">Toutes</option>
                    <option>IA</option>
                    <option>IM</option>
                    <option>GL</option>
                    <option>SE&IoT</option>
                    <option>SI</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Type</label>
                <select id="filtreType">
                    <option value="">Mentor & Mentoré</option>
                    <option value="mentor">Mentor</option>
                    <option value="etudiant">Mentoré</option>
                </select>
            </div>
            <button class="search-btn" onclick="filtrer()">
                 Rechercher
            </button>
        </div>
    </div>

    <!-- Résultats -->
    <p class="results-info" id="resultsInfo">Chargement des correspondances...</p>
    <div class="mentor-grid" id="mentorGrid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Recherche des meilleurs profils pour vous...</p>
        </div>
    </div>
</div>

<script>
    let allMatches = [];
    let currentUser = null;

    // Initialisation
    document.addEventListener('DOMContentLoaded', async () => {
        await checkAuth();
        await loadMatches();
    });

    // Vérifier l'authentification
    async function checkAuth() {
        try {
            const response = await fetch('/api/auth/me', { credentials: 'include' });
            if (!response.ok) {
                window.location.href = '/login';
                return;
            }
            currentUser = await response.json();
        } catch (error) {
            console.error('Erreur auth:', error);
            window.location.href = '/login';
        }
    }

    // Charger les matchs depuis le backend
    async function loadMatches() {
        const grid = document.getElementById('mentorGrid');
        const info = document.getElementById('resultsInfo');

        try {
            const response = await fetch('/api/matching', { credentials: 'include' });
            
            if (response.ok) {
                allMatches = await response.json();
                renderMatches(allMatches);
            } else {
                // Fallback : données de démo si l'API n'est pas prête
                allMatches = getDemoMatches();
                renderMatches(allMatches);
            }
        } catch (error) {
            console.error('Erreur chargement matches:', error);
            allMatches = getDemoMatches();
            renderMatches(allMatches);
        }
    }

    // Données de démo (uniquement si l'API échoue)
    function getDemoMatches() {
        return [
            {
                id: 1, nom: "Utilisateur 1", prenom: "Test",
                filiere: "IA", niveau: "L2", role: "mentor",
                score: 92,
                competences: ["Python", "Machine Learning", "Algorithmique"],
                disponibilites: "Lun, Mer, Ven · 14h-18h"
            },
            {
                id: 2, nom: "Utilisateur 2", prenom: "Demo",
                filiere: "GL", niveau: "L3", role: "mentor",
                score: 85,
                competences: ["SQL", "Base de données", "Java"],
                disponibilites: "Mar, Jeu · 10h-12h"
            }
        ];
    }

    // Afficher les matchs
    function renderMatches(matches) {
        const grid = document.getElementById('mentorGrid');
        const info = document.getElementById('resultsInfo');

        info.innerHTML = `<strong>${matches.length}</strong> correspondance(s) trouvée(s)`;

        if (matches.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon"></div>
                    <p>Aucun résultat trouvé. Essayez d'autres filtres.</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = matches.map(m => {
            const initials = (m.prenom?.charAt(0) || '') + (m.nom?.charAt(0) || '');
            const roleLabel = m.role === 'mentor' ? '🎓 Mentor' : ' Mentoré';
            const roleClass = m.role === 'mentor' ? 'mentor' : 'mentore';

            return `
                <div class="mentor-card">
                    <div class="card-top">
                        <div class="avatar">${initials.toUpperCase()}</div>
                        <div class="card-info">
                            <h4>${m.prenom || ''} ${m.nom || ''}</h4>
                            <div class="meta">
                                ${m.niveau || ''} 
                                <span class="badge-filiere">${m.filiere || ''}</span>
                            </div>
                            <span class="role-badge ${roleClass}">${roleLabel}</span>
                        </div>
                    </div>

                    <div class="score-section">
                        <span class="score-label">Compatibilité</span>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${m.score || 0}%"></div>
                        </div>
                        <span class="score-pct">${m.score || 0}%</span>
                    </div>

                    ${m.competences && m.competences.length > 0 ? `
                        <div class="competences">
                            ${m.competences.map(c => `<span class="tag-small">${c}</span>`).join('')}
                        </div>
                    ` : ''}

                    ${m.disponibilites ? `
                        <div class="dispo-line">🕐 <span>${m.disponibilites}</span></div>
                    ` : ''}

                    <button class="contact-btn" onclick="contacter(${m.id})">
                        💬 Contacter
                    </button>
                </div>
            `;
        }).join('');
    }

    // Filtrer les matchs
    function filtrer() {
        const matiere = document.getElementById('filtreMatiere').value.toLowerCase();
        const filiere = document.getElementById('filtreFiliere').value;
        const type = document.getElementById('filtreType').value;

        const result = allMatches.filter(m => {
            const matchMatiere = !matiere || 
                (m.competences && m.competences.some(c => c.toLowerCase().includes(matiere))) ||
                (m.matiere && m.matiere.toLowerCase().includes(matiere));
            const matchFiliere = !filiere || m.filiere === filiere;
            const matchType = !type || m.role === type;
            return matchMatiere && matchFiliere && matchType;
        });

        renderMatches(result);
    }

    // Contacter un mentor/mentoré
    function contacter(userId) {
        const match = allMatches.find(m => m.id === userId);
        if (match) {
            // Redirection vers la page de chat avec l'ID de l'utilisateur
            window.location.href = `/chat?user_id=${userId}`;
        }
    }
</script>
</body>
</html>
