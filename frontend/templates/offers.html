<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Offres - MentorLink</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav>
    <h1 class="logo">MentorLink🎓</h1>
    <div style="margin-top:15px">
        <a class="btn" href="/profile">Mon Profil</a>
        <a class="btn" href="/matching">Matching</a>
        <a class="btn" href="/chat">Messages</a>
    </div>
</nav>

<div style="max-width:900px;margin:30px auto;padding:0 20px">
    <h2 style="text-align:center;margin-bottom:10px">📋 Offres & Demandes de mentorat</h2>
    <p style="text-align:center;color:#666;margin-bottom:30px">Publiez ou recherchez des offres de mentorat</p>
    
    <!-- BOUTONS PRINCIPAUX -->
    <div style="text-align:center;margin-bottom:30px">
        <button class="btn" onclick="toggleMode('browse')" id="btnBrowse" style="background:#0d6efd;margin:0 10px">
            🔍 Parcourir
        </button>
        <button class="btn" onclick="toggleMode('publish')" id="btnPublish" style="background:#6c757d;margin:0 10px">
            ✏️ Publier
        </button>
    </div>

    <!-- SECTION PARCOURIR -->
    <div id="browseSection">
        <!-- FILTRES -->
        <div class="card" style="margin-bottom:20px">
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end">
                <div>
                    <label style="display:block;margin-bottom:5px;font-weight:500">Matière</label>
                    <input type="text" id="filterMatiere" placeholder="Ex: Python, SQL..." style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
                </div>
                <div>
                    <label style="display:block;margin-bottom:5px;font-weight:500">Type</label>
                    <select id="filterType" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
                        <option value="all">Tous</option>
                        <option value="offre">Offre</option>
                        <option value="demande">Demande</option>
                    </select>
                </div>
                <div>
                    <label style="display:block;margin-bottom:5px;font-weight:500">Format</label>
                    <select id="filterFormat" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px">
                        <option value="all">Tous</option>
                        <option value="en_ligne">En ligne</option>
                        <option value="presentiel">Présentiel</option>
                        <option value="les_deux">Les deux</option>
                    </select>
                </div>
                <button class="btn" onclick="applyFilters()" style="background:#0d6efd">
                    🔍 Filtrer
                </button>
            </div>
        </div>

        <!-- LISTE DES OFFRES -->
        <div id="offersList">
            <!-- Les offres seront chargées ici dynamiquement -->
        </div>
    </div>

    <!-- SECTION PUBLIER -->
    <div id="publishSection" style="display:none">
        <div class="card">
            <h3 style="margin-bottom:20px">📝 Publier une offre/demande</h3>
            <form id="publishForm" onsubmit="publishOffer(event)">
                <div style="margin-bottom:15px">
                    <label style="display:block;margin-bottom:5px;font-weight:500">Type *</label>
                    <select id="pubType" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px">
                        <option value="offre">Offre (Je propose mon aide)</option>
                        <option value="demande">Demande (Je cherche un mentor)</option>
                    </select>
                </div>

                <div style="margin-bottom:15px">
                    <label style="display:block;margin-bottom:5px;font-weight:500">Matière *</label>
                    <input type="text" id="pubMatiere" placeholder="Ex: Python, Algorithmique, Base de données..." required 
                           style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px">
                </div>

                <div style="margin-bottom:15px">
                    <label style="display:block;margin-bottom:5px;font-weight:500">Format *</label>
                    <select id="pubFormat" required style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px">
                        <option value="en_ligne">En ligne</option>
                        <option value="presentiel">Présentiel</option>
                        <option value="les_deux">Les deux</option>
                    </select>
                </div>

                <div style="margin-bottom:15px">
                    <label style="display:block;margin-bottom:5px;font-weight:500">Disponibilités</label>
                    <input type="text" id="pubDisponibilites" placeholder="Ex: Lun, Mer - 14h-17h" 
                           style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px">
                </div>

                <div style="margin-bottom:15px">
                    <label style="display:block;margin-bottom:5px;font-weight:500">Description *</label>
                    <textarea id="pubDescription" rows="4" placeholder="Décrivez votre offre ou demande..." required
                              style="width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;resize:vertical"></textarea>
                </div>

                <div style="text-align:right">
                    <button type="button" class="btn" onclick="toggleMode('browse')" style="background:#6c757d;margin-right:10px">
                        Annuler
                    </button>
                    <button type="submit" class="btn" style="background:#28a745">
                        ✅ Publier
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    let currentUser = null;
    let allOffers = [];

    // Initialisation
    document.addEventListener('DOMContentLoaded', async () => {
        await checkAuth();
        await loadOffers();
    });

    // Vérifier l'authentification
    async function checkAuth() {
        try {
            const response = await fetch('/api/auth/me', { credentials: 'include' });
            if (!response.ok) {
                window.location.href = '/login';
                return;
            }
            currentUser = await response.json();
        } catch (error) {
            console.error('Erreur auth:', error);
            window.location.href = '/login';
        }
    }

    // Basculer entre mode Parcourir et Publier
    function toggleMode(mode) {
        const browseSection = document.getElementById('browseSection');
        const publishSection = document.getElementById('publishSection');
        const btnBrowse = document.getElementById('btnBrowse');
        const btnPublish = document.getElementById('btnPublish');

        if (mode === 'browse') {
            browseSection.style.display = 'block';
            publishSection.style.display = 'none';
            btnBrowse.style.background = '#0d6efd';
            btnPublish.style.background = '#6c757d';
        } else {
            browseSection.style.display = 'none';
            publishSection.style.display = 'block';
            btnBrowse.style.background = '#6c757d';
            btnPublish.style.background = '#0d6efd';
        }
    }

    // Charger les offres
    async function loadOffers(filters = {}) {
        try {
            let url = '/api/offers?';
            if (filters.matiere) url += `matiere=${filters.matiere}&`;
            if (filters.type && filters.type !== 'all') url += `type=${filters.type}&`;
            if (filters.format && filters.format !== 'all') url += `format=${filters.format}&`;

            const response = await fetch(url, { credentials: 'include' });
            
            if (response.ok) {
                allOffers = await response.json();
            } else {
                // Données de démo si l'API n'est pas prête
                allOffers = getDemoOffers();
            }
            
            renderOffers(allOffers);
        } catch (error) {
            console.error('Erreur chargement offres:', error);
            allOffers = getDemoOffers();
            renderOffers(allOffers);
        }
    }

    // Appliquer les filtres
    function applyFilters() {
        const filtres = {
            matiere: document.getElementById('filterMatiere').value,
            type: document.getElementById('filterType').value,
            format: document.getElementById('filterFormat').value
        };
        loadOffers(filtres);
    }

    // Afficher les offres
    function renderOffers(offers) {
        const container = document.getElementById('offersList');
        
        if (offers.length === 0) {
            container.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:#666">Aucune offre trouvée</div>';
            return;
        }

        container.innerHTML = offers.map(offer => `
            <div class="card" style="margin-bottom:15px">
                <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px">
                    <h3 style="margin:0">${offer.matiere}</h3>
                    <span style="font-size:0.85rem;color:#666">Par ${offer.auteur_nom || 'Anonyme'}</span>
                </div>
                
                <div style="margin-bottom:10px">
                    <span class="badge" style="background:${offer.type === 'offre' ? '#28a745' : '#ffc107'};color:white;padding:3px 8px;border-radius:4px;font-size:0.8rem">
                        ${offer.type === 'offre' ? '✓ Offre' : '⚑ Demande'}
                    </span>
                    <span class="badge" style="background:#17a2b8;color:white;padding:3px 8px;border-radius:4px;font-size:0.8rem;margin-left:5px">
                        ${offer.format === 'en_ligne' ? '🌐 En ligne' : offer.format === 'presentiel' ? '📍 Présentiel' : '🔄 Les deux'}
                    </span>
                    ${offer.disponibilites ? `<span class="badge" style="background:#6c757d;color:white;padding:3px 8px;border-radius:4px;font-size:0.8rem;margin-left:5px">🕐 ${offer.disponibilites}</span>` : ''}
                </div>
                
                <p style="color:#555;margin:10px 0">${offer.description}</p>
                
                <div style="text-align:right">
                    <button class="btn" onclick="repondreOffre(${offer.id})" style="background:#0d6efd;padding:6px 12px;font-size:0.9rem">
                        💬 Répondre
                    </button>
                </div>
            </div>
        `).join('');
    }

    // Publier une offre
    async function publishOffer(event) {
        event.preventDefault();
        
        const offreData = {
            type: document.getElementById('pubType').value,
            matiere: document.getElementById('pubMatiere').value,
            format: document.getElementById('pubFormat').value,
            disponibilites: document.getElementById('pubDisponibilites').value,
            description: document.getElementById('pubDescription').value
        };

        try {
            const response = await fetch('/api/offers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify(offreData)
            });

            if (response.ok) {
                alert('✅ Offre publiée avec succès!');
                document.getElementById('publishForm').reset();
                toggleMode('browse');
                await loadOffers();
            } else {
                const data = await response.json();
                alert('❌ Erreur: ' + data.message);
            }
        } catch (error) {
            console.error('Erreur publication:', error);
            alert('✅ Offre publiée (mode démo)!');
            document.getElementById('publishForm').reset();
            toggleMode('browse');
        }
    }

    // Répondre à une offre
    function repondreOffre(offerId) {
        const offer = allOffers.find(o => o.id === offerId);
        if (offer) {
            alert('💬 Redirection vers la conversation avec ' + (offer.auteur_nom || "l'utilisateur") + '\n\nOffre: ' + offer.matiere);
            // Redirection vers le chat avec l'auteur de l'offre
            // window.location.href = `/chat?offer_id=${offerId}`;
        }
    }

    // Données de démo (fallback)
    function getDemoOffers() {
        return [
            {
                id: 1,
                type: 'offre',
                matiere: 'Python',
                format: 'en_ligne',
                disponibilites: 'Lun, Mer - 14h-17h',
                description: 'Je propose des sessions de Python pour débutants et intermédiaires.',
                auteur_nom: 'Kofi M.'
            },
            {
                id: 2,
                type: 'demande',
                matiere: 'Base de données',
                format: 'presentiel',
                disponibilites: 'Mar, Jeu - 10h-12h',
                description: 'Je cherche un mentor pour m\'aider avec SQL et la modélisation.',
                auteur_nom: 'Fatou D.'
            },
            {
                id: 3,
                type: 'offre',
                matiere: 'Algorithmique',
                format: 'les_deux',
                disponibilites: 'Ven - 16h-18h',
                description: 'Aide en algorithmique et structures de données niveau L1/L2.',
                auteur_nom: 'Brice H.'
            },
            {
                id: 4,
                type: 'demande',
                matiere: 'JavaScript',
                format: 'en_ligne',
                disponibilites: 'Sam - 9h-12h',
                description: 'Je débute en JS et cherche un mentor pour les bases.',
                auteur_nom: 'Aïcha T.'
            }
        ];
    }
</script>
</body>
</html>
